server.port=8080
spring.application.name=medicare-pharmacy

spring.datasource.url=jdbc:postgresql://localhost:5433/pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=mediCareCapstoneSecretKeyForJwtSigningMustBeLongEnough32Chars!
jwt.expiration=86400000

app.upload.dir=uploads
app.upload.max-size-mb=5

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.medicare=INFO

management.endpoints.web.exposure.include=health,info
