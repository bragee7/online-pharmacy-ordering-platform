spring.application.name=online-pharmacy-backend

# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

# ------------------------------------------------------------------
# DataSource (MySQL 8). Schema is created by Flyway, not Hibernate.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_pharmacy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:pharmacy}
spring.datasource.password=${DB_PASSWORD:pharmacyDev2024}
spring.datasource.hikari.maximum-pool-size=10

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# Flyway migrations
# ------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ------------------------------------------------------------------
# Application (custom)
# ------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:hT5IjmsChWqip35c4rnZaHH/tJybdSZGi42UgEcSwT6lNhp5zfWn8bCPt7J7q6Vb}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed.enabled=${APP_SEED_ENABLED:true}

# ------------------------------------------------------------------
# OpenAPI / Swagger
# ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
logging.level.com.onlinepharmacy=INFO
logging.level.org.hibernate.SQL=INFO